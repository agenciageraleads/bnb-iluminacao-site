name: Validate

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
  # Permite redisparar o Validate à mão. Necessário porque o Deploy só escuta
  # `workflow_run` do Validate: quando um deploy se perde (corrida de
  # concurrency, falha de infra), o `rerun` do run antigo NÃO redispara o Deploy,
  # e sem isso a única saída era empurrar um commit vazio para a main.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: catalog_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_test -d catalog_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test blog quality gate
        run: node scripts/test-blog-validation.mjs

      - name: Test commercial catalog and PostgreSQL migration
        env:
          TEST_CATALOG_DATABASE_URL: postgres://catalog_test:catalog_test@127.0.0.1:5432/catalog_migration_test
        run: |
          node node_modules/tsx/dist/cli.mjs scripts/test-commercial-catalog.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-catalog-migration.ts
