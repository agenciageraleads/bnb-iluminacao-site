name: Validate

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
  # Permite redisparar o Validate à mão. Necessário porque o Deploy só escuta
  # `workflow_run` do Validate: quando um deploy se perde (corrida de
  # concurrency, falha de infra), o `rerun` do run antigo NÃO redispara o Deploy,
  # e sem isso a única saída era empurrar um commit vazio para a main.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test blog quality gate
        run: node scripts/test-blog-validation.mjs
