version: '3.8'

services:
  bnb-site:
    build: .
    container_name: bnb_site
    env_file: .env
    restart: always
    ports:
      - "9010:9010"
    environment:
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-bnb_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-bnb_database}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      - BLOG_ENGINE_SECRET=${BLOG_ENGINE_SECRET:?BLOG_ENGINE_SECRET is required}
      - REDIS_URL=redis://redis:6379
      # Traefik must overwrite X-Real-IP and direct access to port 9010 must be blocked.
      - PUBLIC_FORM_TRUSTED_IP_HEADER=x-real-ip
    depends_on:
      - postgres
      - redis
    volumes:
      - ./media:/app/media

  postgres:
    image: postgres:15-alpine
    container_name: bnb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bnb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bnb_database}
    ports:
      - "127.0.0.1:9005:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bnb_redis
    restart: always
    ports:
      - "127.0.0.1:9002:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
